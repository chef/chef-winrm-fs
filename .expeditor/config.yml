# Documentation available at https://expeditor.chef.io/docs/getting-started/
---
# Slack channel in Chef Software slack to send notifications about build failures, etc
slack:
  notify_channel: chef-notify

# TODO: Re-enable rubygems publishing once rubygems@chef.io is added as an
# owner of the chef-winrm-fs gem on rubygems.org (currently only "hayfever76"
# is listed as an owner). Expeditor refuses to proceed when it isn't an owner
# of a pre-existing gem. Request ownership via the #chef-dev Slack channel,
# then uncomment the block below and the `built_in:publish_rubygems` action.
# rubygems:
#   - chef-winrm-fs

github:
  # This deletes the GitHub PR branch after successfully merged into the release branch
  delete_branch_on_merge: true
  # The tag format to use (e.g. v1.0.0)
  version_tag_format: "chef-winrm-fs-{{version}}"
  # allow bumping the minor release via label
  minor_bump_labels:
    - "Expeditor: Bump Version Minor"

release_branches:
  - main:
      version_constraint: "1.*"

changelog:
  rollup_header: Changes not yet released to rubygems.org

pipelines:
  - verify:
      description: Pull Request validation tests
      public: true

subscriptions:
  # These actions are taken, in order they are specified, anytime a Pull Request is merged.
  - workload: pull_request_merged:{{github_repo}}:{{release_branch}}:*
    actions:
      - built_in:bump_version:
          ignore_labels:
            - "Expeditor: Skip Version Bump"
            - "Expeditor: Skip All"
      - built_in:update_changelog:
          ignore_labels:
            - "Expeditor: Skip Changelog"
            - "Expeditor: Skip All"
      - built_in:build_gem:
          only_if: built_in:bump_version

  - workload: project_promoted:{{agent_id}}:*
    actions:
      - built_in:rollover_changelog
      # TODO: re-enable once rubygems@chef.io is an owner of chef-winrm-fs on
      # rubygems.org (see TODO above the `rubygems:` key).
      # - built_in:publish_rubygems
